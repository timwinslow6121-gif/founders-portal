{% extends "base.html" %}
{% block title %}All Commissions{% endblock %}

{% block styles %}
  {# base.html wraps {% block styles %} in its own <style> — do NOT add <style> here. #}
  .agg-page{ --a-blue:var(--gold); --a-green:var(--green); --a-navy:var(--ivory-bright);
    --a-ink:var(--ivory); --a-muted:var(--slate); --a-border:var(--border);
    --a-card:var(--surface); --a-bg:var(--ink); --a-neg:var(--status-error);
    max-width:1180px; margin:0 auto; }
  .agg-page h1{ color:var(--a-navy); margin:0 0 4px; }
  .agg-lead{ color:var(--a-muted); font-size:.86rem; margin:0 0 18px; }
  /* one contained control bar */
  .agg-toolbar{ display:flex; gap:14px; align-items:center; margin:0 0 16px; flex-wrap:wrap;
    background:var(--a-card); border:1px solid var(--a-border); border-radius:14px;
    box-shadow:var(--shadow); padding:10px 14px; }
  .agg-toggle{ display:inline-flex; border:1px solid var(--a-border); border-radius:999px; overflow:hidden; background:var(--a-bg); }
  .agg-toggle a{ padding:6px 14px; text-decoration:none; color:var(--a-muted); font-size:.82rem; }
  .agg-toggle a.on{ background:var(--a-blue); color:#fff; }
  .agg-toolbar select{ padding:6px 12px; border:1px solid var(--a-border); border-radius:10px; background:var(--a-bg); color:var(--a-ink); font:inherit; font-size:.82rem; width:auto; max-width:180px; }
  /* Material-3 on/off switch */
  .m3switch{ display:inline-flex; align-items:center; gap:9px; font-size:.82rem; color:var(--a-ink); cursor:pointer; user-select:none; }
  .m3switch input{ position:absolute; opacity:0; width:0; height:0; }
  .m3track{ position:relative; width:42px; height:24px; border-radius:999px; background:var(--a-bg);
    border:2px solid var(--a-muted); transition:background .18s, border-color .18s; flex:none; }
  .m3thumb{ position:absolute; top:4px; left:4px; width:12px; height:12px; border-radius:50%;
    background:var(--a-muted); transition:transform .18s, width .18s, height .18s, top .18s, left .18s, background .18s; }
  .m3switch input:checked + .m3track{ background:var(--a-blue); border-color:var(--a-blue); }
  .m3switch input:checked + .m3track .m3thumb{ transform:translateX(18px); width:16px; height:16px; top:2px; left:2px; background:#fff; }
  .m3switch input:focus-visible + .m3track{ outline:2px solid var(--a-blue); outline-offset:2px; }
  .cdot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:5px; vertical-align:middle; }
  .cdot.ok{ background:var(--a-green); }
  .cdot.zero{ background:var(--a-muted); }
  .cdot-btn{ background:none; border:1px solid #C2701A; color:#C2701A; border-radius:999px; font-size:.6rem; padding:1px 6px; margin-left:5px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .cdot-btn:hover{ background:color-mix(in srgb,#C2701A 12%,transparent); }
  /* persistent agent nav bar (1-click into a recap), matches the recap page pills */
  .agg-page .agent-bar{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; padding:10px;
    background:var(--a-card); border:1px solid var(--a-border); border-radius:14px; box-shadow:var(--shadow); }
  /* pills GROW to fill the row evenly; min-width floor forces wrap to 2+ lines on
     small screens (phones/tablets) instead of shrinking unreadably. */
  .agg-page .agent-pill{ flex:1 1 120px; min-width:120px; text-align:center;
    padding:8px 13px; border-radius:999px; font-size:.84rem; text-decoration:none;
    color:var(--a-ink); background:color-mix(in srgb, var(--a-blue) 8%, transparent); border:1px solid transparent; white-space:nowrap; }
  .agg-page .agent-pill:hover{ border-color:var(--a-blue); color:var(--a-blue); }
  .agg-card{ background:var(--a-card); border:1px solid var(--a-border); border-radius:var(--radius); box-shadow:var(--shadow); padding:8px; overflow-x:auto; }
  table.agg{ width:100%; border-collapse:collapse; font-size:.86rem; }
  table.agg th, table.agg td{ padding:9px 10px; border-bottom:1px solid var(--a-border); white-space:nowrap; }
  table.agg thead th{ color:var(--a-muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; text-align:right; }
  table.agg thead th:first-child{ text-align:left; }
  table.agg td:first-child{ font-weight:600; color:var(--a-ink); }
  table.agg td:first-child a.agent-link{ color:var(--a-ink); text-decoration:none; }
  table.agg td:first-child a.agent-link:hover{ color:var(--a-blue); text-decoration:underline; }
  table.agg td.cell{ text-align:right; font-variant-numeric:tabular-nums; }
  table.agg td.cell a{ color:var(--a-ink); text-decoration:none; display:block; border-radius:6px; padding:2px 4px; margin:-2px -4px; }
  table.agg td.cell a:hover{ background:color-mix(in srgb, var(--a-blue) 12%, transparent); }
  table.agg td.cell .sub{ color:var(--a-green); font-size:.68rem; }
  /* Founders-keep detail is hidden by default; the toggle adds .show-keep. */
  table.agg td.cell .sub.keep-only{ display:none; }
  table.agg.show-keep td.cell .sub.keep-only{ display:block; }
  table.agg .keepcol{ display:none; }
  table.agg.show-keep .keepcol{ display:table-cell; }
  .agg-keepswitch{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; color:var(--a-muted); cursor:pointer; }
  .agg-review-btn{ margin-left:auto; display:inline-flex; align-items:center; gap:5px;
    background:#C2701A; color:#fff; font-size:.8rem; font-weight:600; text-decoration:none;
    padding:7px 13px; border-radius:999px; border:1px solid #C2701A; white-space:nowrap; }
  .agg-review-btn:hover{ filter:brightness(1.08); }
  table.agg td.empty{ text-align:right; color:var(--a-muted); }
  table.agg td.neg, table.agg td.cell a.neg{ color:var(--a-neg); }
  table.agg td.pt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
  table.agg td.kt{ text-align:right; font-variant-numeric:tabular-nums; color:var(--a-green); }
  table.agg tr.agencyrow td{ border-top:1px dashed var(--a-border); background:color-mix(in srgb, var(--a-green) 6%, transparent); }
  table.agg tr.agencyrow td:first-child{ color:var(--a-green); font-weight:600; }
  table.agg tr.agencyrow td.ovr{ color:var(--a-green); font-variant-numeric:tabular-nums; }
  table.agg .agency-sub{ font-size:.66rem; color:var(--a-muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  table.agg tr.total td{ font-weight:700; border-top:2px solid var(--a-navy); border-bottom:none; color:var(--a-navy); }
  table.agg tr.total td.grand{ color:var(--a-blue); }
  .agg-empty{ padding:40px; text-align:center; color:var(--a-muted); }
{% endblock %}

{% block content %}
<div class="agg-page">
  <h1>Agent Commissions</h1>
  <p class="agg-lead">Founders overview — every agent × every carrier. Click an agent's name (or a cell) to open their full recap.</p>

  <div class="agg-toolbar">
    <div class="agg-toggle">
      <a href="{{ url_for('commission.admin_aggregate', scope='month', period=period_label) }}"
         class="{{ 'on' if scope == 'month' else '' }}">This month</a>
      <a href="{{ url_for('commission.admin_aggregate', scope='ytd', period=period_label) }}"
         class="{{ 'on' if scope == 'ytd' else '' }}">Year-to-date</a>
    </div>
    <select onchange="location.href='{{ url_for('commission.admin_aggregate', scope=scope) }}&period='+encodeURIComponent(this.value)">
      {% for p in periods %}
      <option value="{{ p }}" {{ 'selected' if p == period_label else '' }}>{{ p }}</option>
      {% endfor %}
    </select>
    <label class="m3switch" title="Show Founders' keep (split-share + override) per cell">
      <input type="checkbox" id="aggKeepToggle">
      <span class="m3track"><span class="m3thumb"></span></span>
      Founders keep
    </label>
    {% if matrix.grand.pending_count %}
    <a class="agg-review-btn" href="{{ url_for('commission.commission_quarantine_workbench', period=period_label) }}"
       title="Payments that couldn't be reliably attributed (any carrier) — click to resolve in the Quarantine Workbench">
      ⚠ {{ matrix.grand.pending_count }} payment{{ 's' if matrix.grand.pending_count != 1 else '' }} to review: ${{ '{:,.2f}'.format(matrix.grand.pending) }} pending
    </a>
    {% endif %}
  </div>

  {# Persistent agent nav bar — 1 click into any agent's recap, always visible
     above the matrix (below the month/YTD toolbar). #}
  {% if agents %}
  <div class="agent-bar" aria-label="Open an agent's recap">
    {% for a in agents %}
    <a class="agent-pill" href="{{ url_for('commission.admin_recap', agent_id=a.id, period=period_label) }}">{{ a.name }}</a>
    {% endfor %}
  </div>
  {% endif %}

  {% if matrix.rows %}
  <div class="agg-card">
    <table class="agg" id="aggTable">
      <thead>
        <tr>
          <th>Agent</th>
          {% for c in matrix.carriers %}
          <th>{{ c }}
            {% set st = (carrier_status or {}).get(c) %}
            {% if st == 'received' %}<span class="cdot ok" title="Statement received"></span>
            {% elif st == 'confirmed_zero' %}<span class="cdot zero" title="AJ confirmed $0 — no business"></span>
            {% elif st == 'pending' %}
              <form method="post" action="{{ url_for('commission.admin_confirm_zero') }}" style="display:inline"
                    onsubmit="return confirm('Confirm {{ c }} had NO business for {{ period_label }}?')">
                <input type="hidden" name="carrier" value="{{ c }}">
                <input type="hidden" name="period" value="{{ period_label }}">
                <button type="submit" class="cdot-btn" title="Statement not uploaded — click to confirm $0">⏳ confirm $0</button>
              </form>
            {% endif %}
          </th>
          {% endfor %}
          <th>Payout</th>
          <th class="keepcol" title="Founders' share of split commissions">F. split</th>
          <th class="keepcol" title="Pure Founders-override lines (100% Founders)">Override</th>
        </tr>
      </thead>
      <tbody>
        {% for r in matrix.rows %}
        <tr>
          <td>{% if r.agent_id %}<a class="agent-link" href="{{ url_for('commission.admin_recap', agent_id=r.agent_id, period=period_label) }}" title="Open {{ r.agent_name }}'s recap">{{ r.agent_name }}</a>{% else %}{{ r.agent_name }}{% endif %}</td>
          {% for c in matrix.carriers %}
            {% set cell = r.cells.get(c) %}
            {% if cell %}
            <td class="cell">
              {% if r.agent_id and scope == 'month' %}
              <a class="{{ 'neg' if cell.payout < 0 else '' }}"
                 href="{{ url_for('commission.admin_recap', agent_id=r.agent_id, period=period_label, carrier=c) }}"
                 title="{{ r.agent_name }} · {{ c }} — payout ${{ '%.2f'|format(cell.payout) }} · Founders split-share ${{ '%.2f'|format(cell.split_keep) }} · override ${{ '%.2f'|format(cell.override) }}{% if cell.pending %} · pending ${{ '%.2f'|format(cell.pending) }}{% endif %}">
                {{ '${:,.2f}'.format(cell.payout) }}
                <span class="sub keep-only">split {{ '${:,.0f}'.format(cell.split_keep) }} · ovr {{ '${:,.0f}'.format(cell.override) }}</span>
              </a>
              {% else %}
              <span class="{{ 'neg' if cell.payout < 0 else '' }}">{{ '${:,.2f}'.format(cell.payout) }}</span>
              <span class="sub keep-only">split {{ '${:,.0f}'.format(cell.split_keep) }} · ovr {{ '${:,.0f}'.format(cell.override) }}</span>
              {% endif %}
            </td>
            {% else %}
            <td class="empty">—</td>
            {% endif %}
          {% endfor %}
          <td class="pt {{ 'neg' if r.payout_total < 0 else '' }}">{{ '${:,.2f}'.format(r.payout_total) }}</td>
          <td class="kt keepcol">{{ '${:,.2f}'.format(r.split_keep_total) }}</td>
          <td class="kt keepcol">{{ '${:,.2f}'.format(r.override_total) }}</td>
        </tr>
        {% endfor %}
        {% if matrix.agency_row and matrix.agency_row.total %}
        <tr class="agencyrow" title="The agency's own earnings — Founders override lines (100% Founders), per carrier">
          <td>Founders Agency <span class="agency-sub">overrides</span></td>
          {% for c in matrix.carriers %}
            {% set ov = matrix.agency_row.cells.get(c) %}
            {% if ov %}<td class="cell ovr">{{ '${:,.2f}'.format(ov) }}</td>
            {% else %}<td class="empty">—</td>{% endif %}
          {% endfor %}
          <td class="pt ovr">{{ '${:,.2f}'.format(matrix.agency_row.total) }}</td>
          <td class="kt keepcol"></td>
          <td class="kt keepcol"></td>
        </tr>
        {% endif %}
        <tr class="total">
          <td>TOTAL</td>
          {% for c in matrix.carriers %}
          <td class="cell">{{ '${:,.2f}'.format(matrix.carrier_totals[c].payout) }}
            <span class="sub keep-only">split {{ '${:,.0f}'.format(matrix.carrier_totals[c].split_keep) }} · ovr {{ '${:,.0f}'.format(matrix.carrier_totals[c].override) }}</span>
          </td>
          {% endfor %}
          <td class="grand">{{ '${:,.2f}'.format(matrix.grand.payout) }}</td>
          <td class="kt keepcol">{{ '${:,.2f}'.format(matrix.grand.split_keep) }}</td>
          <td class="kt keepcol">{{ '${:,.2f}'.format(matrix.grand.override) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    (function(){
      var cb = document.getElementById('aggKeepToggle');
      var t  = document.getElementById('aggTable');
      if(!cb || !t) return;
      var KEY = 'fp-agg-show-keep';
      function apply(){ t.classList.toggle('show-keep', cb.checked); }
      cb.checked = localStorage.getItem(KEY) === '1';
      apply();
      cb.addEventListener('change', function(){
        localStorage.setItem(KEY, cb.checked ? '1' : '0'); apply();
      });
    })();
  </script>
  {% else %}
  <div class="agg-card"><div class="agg-empty">No commission data for this period yet.</div></div>
  {% endif %}
</div>
{% endblock %}
