<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Founders Insurance — Agent Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--blue:#266EA5;--blue-deep:#1B5380;--green:#65BB84;--navy:#002E4D;--ink:#1A202C;--slate:#718096;
    --sans:'Plus Jakarta Sans',-apple-system,sans-serif;--serif:'Merriweather',Georgia,serif;}
  *{box-sizing:border-box;margin:0;padding:0}

  /* Full-viewport waving blue→green gradient (was a .screen box in the prototype) */
  body{font-family:var(--sans);color:#fff;min-height:100vh;min-height:100dvh;
       display:flex;align-items:center;justify-content:center;padding:18px;
       position:relative;overflow:hidden;background:#0E1726}
  body::before{content:"";position:fixed;inset:-40%;z-index:0;
    background:linear-gradient(135deg,var(--blue-deep) 0%,var(--blue) 28%,#3E8FA0 52%,var(--green) 78%,#79C795 100%);
    background-size:260% 260%;animation:wave 14s ease-in-out infinite;}
  @keyframes wave{0%{background-position:0% 50%}25%{background-position:50% 35%}50%{background-position:100% 50%}75%{background-position:50% 65%}100%{background-position:0% 50%}}
  body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 28% 25%, rgba(255,255,255,.12), rgba(255,255,255,0) 60%);
    animation:sheen 16s ease-in-out infinite;}
  @keyframes sheen{0%,100%{transform:translate(0,0)}50%{transform:translate(44px,30px)}}

  /* unified glass card — roomier vertical padding */
  .card{position:relative;z-index:3;width:392px;max-width:92%;text-align:center;color:#fff;
    background:rgba(255,255,255,.15);backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid rgba(255,255,255,.45);border-radius:22px;padding:42px 38px 46px;
    box-shadow:0 24px 64px rgba(0,20,40,.42), inset 0 1px 0 rgba(255,255,255,.55);
    opacity:0;transform:translateY(14px) scale(.985);animation:cardIn .55s cubic-bezier(.2,.8,.25,1) forwards .05s}
  @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}

  /* TITLE — two lines, FOUNDERS all caps tracked out to optically match Agent Portal width */
  .title{font-family:var(--serif);font-weight:900;line-height:1.16;color:#fff;
    text-shadow:0 1px 2px rgba(0,28,52,.7),0 3px 10px rgba(0,30,60,.6),0 6px 30px rgba(0,30,60,.55);
    opacity:0;animation:fadeUp .5s ease forwards .25s;display:inline-block;text-align:center}
  .title .l1{display:block;font-size:30px;letter-spacing:0.10em;}
  .title .l2{display:block;font-size:30px;letter-spacing:.01em;color:#eafff2;margin-top:2px;white-space:nowrap}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* logo — animated; pestle perpetually compounds (the Cannon Pharmacy origin) */
  .logo{position:relative;z-index:3;width:150px;height:150px;display:block;margin:22px auto 0;
    filter:drop-shadow(0 6px 20px rgba(0,28,54,.4));}
  .logo .p-hand{fill:#fff}.logo .p-bowl,.logo .p-rim,.logo .p-pestle{fill:#f3fff7}
  .logo .p-hand{opacity:0;transform:scale(.82);transform-box:fill-box;transform-origin:center;animation:handIn .5s cubic-bezier(.2,.8,.25,1) forwards .5s}
  @keyframes handIn{to{opacity:1;transform:scale(1)}}
  .logo .p-bowl{opacity:0;transform:translateY(24px);transform-box:fill-box;transform-origin:center;animation:rise .4s cubic-bezier(.2,.8,.3,1) forwards .8s}
  .logo .p-rim{opacity:0;transform:translateY(18px);transform-box:fill-box;transform-origin:center;animation:rise .4s cubic-bezier(.2,.8,.3,1) forwards .92s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .logo .p-pestle{opacity:0;transform-box:fill-box;transform-origin:50% 95%;
    animation:pestleIn .5s cubic-bezier(.34,1.56,.64,1) forwards 1.1s, grind 2.8s ease-in-out infinite 1.6s}
  @keyframes pestleIn{0%{opacity:0;transform:translateY(-64px)}60%{opacity:1}to{opacity:1;transform:translateY(0)}}
  @keyframes grind{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2.5px,1.5px) rotate(-7deg)}50%{transform:translate(0,2.5px) rotate(0)}75%{transform:translate(2.5px,1.5px) rotate(7deg)}100%{transform:translate(0,0) rotate(0)}}

  .welcome{font-family:var(--serif);font-weight:700;color:#fff;font-size:19px;margin-top:26px;
    opacity:0;animation:fadeUp .5s ease forwards 1.0s}
  .welcome-sub{color:rgba(255,255,255,.82);font-size:13px;margin-top:6px;margin-bottom:28px;
    opacity:0;animation:fadeUp .5s ease forwards 1.1s}

  /* Error notice — readable red on the glass */
  .login-error{background:rgba(192,57,43,.22);border:1px solid rgba(255,180,171,.55);
    color:#fff;border-radius:11px;padding:11px 14px;font-size:13px;line-height:1.45;
    margin:0 0 22px;text-align:left;
    opacity:0;animation:fadeUp .5s ease forwards 1.05s}

  .gbtn{display:inline-flex;align-items:center;gap:11px;background:#fff;border:none;border-radius:11px;
        padding:13px 22px;font-family:var(--sans);font-weight:600;font-size:15px;color:#3c4043;cursor:pointer;
        text-decoration:none;box-shadow:0 6px 18px rgba(0,20,40,.25);transition:box-shadow .2s,transform .2s;
        opacity:0;animation:fadeUp .5s ease forwards 1.2s}
  .gbtn:hover{box-shadow:0 10px 26px rgba(0,20,40,.34);transform:translateY(-2px)}
  .gbtn.loading{pointer-events:none;opacity:1;color:#5f6368}
  .gicon{width:19px;height:19px}
  /* OAuth-wait spinner (the 3-5s Google round-trip is unavoidable; this covers it) */
  .gspin{width:18px;height:18px;border:2px solid #dadce0;border-top-color:#266EA5;border-radius:50%;
         display:none;animation:gspin .7s linear infinite}
  .gbtn.loading .gspin{display:inline-block}
  .gbtn.loading .gicon{display:none}
  @keyframes gspin{to{transform:rotate(360deg)}}
  .fine{margin-top:24px;color:rgba(255,255,255,.78);font-size:11.5px;line-height:1.5;
    opacity:0;animation:fadeUp .5s ease forwards 1.3s}

  @media(prefers-reduced-motion:reduce){
    body::before,body::after,.card,.title,.login-error,.p-hand,.p-bowl,.p-rim,.p-pestle,.welcome,.welcome-sub,.gbtn,.fine{
      animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">
      <span class="l1">FOUNDERS</span>
      <span class="l2">Agent&nbsp;Portal</span>
    </div>
    <svg class="logo" viewBox="0 0 97 97" aria-hidden="true"><g transform="matrix(1.3333333,0,0,-1.3333333,0,97.013333)"><g transform="scale(0.1)">
<path class="p-hand" d="m 359.082,727.59 c 83.34,0.203 160.164,-27.914 221.293,-75.473 -48.637,28.184 -105.172,44.274 -165.328,44.125 C 233.918,695.793 87.3789,548.711 87.5078,367.535 c 0,-0.199 -0.0156,-0.394 -0.0117,-0.597 0.125,-50.883 11.8359,-99.051 32.5669,-141.954 21.75,-11.66 45.429,-15.265 71.425,-16.296 91.473,-3.797 168.7,-38.977 232.223,-102.907 -52.289,-24.406 -102.32,-1.195 -138.305,20.407 29.153,-44.9536 71.528,-57.4185 118.024,-59.3794 26.968,-1.1875 54.011,-0.0313 81.011,0.6133 7.086,0.1679 14.164,0.3359 21.239,0.3711 6.289,0.082 12.648,0.3047 18.836,-0.2539 53.371,-4.836 30.082,-30.0586 -4.926,-42.2188 C 317.461,-44.8945 103.727,32.5 24.125,237.898 8.62109,277.898 0.113281,321.324 0,366.723 -0.492188,565.617 160.305,727.09 359.082,727.59"/>
<path class="p-bowl" d="M 589.289,301.172 H 129.832 c 3.957,-17.078 9.449,-33.797 16.449,-49.984 14.774,-5.555 30.989,-7.133 46.633,-7.774 80.793,-3.316 153.508,-28.98 217.191,-79.074 7.473,-5.875 14.735,-12.012 21.778,-18.395 5.613,-5.09 11.137,-10.289 16.48,-15.668 l 28.114,-28.293 c 2.378,0.067 4.757,0.129 7.132,0.184 7.239,0.172 14.477,0.305 21.715,0.383 17.395,0.176 32.293,0.308 48.528,-6.9416 1.086,-0.461 2.156,-0.9531 3.207,-1.4688 33.214,41.0704 53.507,121.5274 63.14,169.1484 3.965,19.602 -10.91,37.883 -30.91,37.883"/>
<path class="p-rim" d="M 350.348,316.301 H 126.746 c -2.758,15.629 -4.258,31.504 -4.469,47.492 h 228.071 253.25 c 13.117,0 23.746,-10.633 23.746,-23.742 0,-13.121 -10.629,-23.75 -23.746,-23.75 h -253.25"/>
<path class="p-pestle" d="m 542.68,384.059 36.082,81.175 c 25.551,5.336 44.75,27.985 44.75,55.121 0,31.114 -25.215,56.333 -56.324,56.333 -31.106,0 -56.329,-25.219 -56.329,-56.333 0,-11.078 3.254,-21.386 8.782,-30.101 L 441.207,384.059 H 542.68"/>
      </g></g></svg>
    <div class="welcome">Welcome back</div>
    <div class="welcome-sub">Sign in to continue</div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <a href="/auth/google" class="gbtn" onclick="this.classList.add('loading');this.querySelector('.glabel').textContent='Connecting to Google…';">
      <span class="gspin"></span><svg class="gicon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.3-4.6 2.1-7.9 2.1-6.3 0-11.6-3.8-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span class="glabel">Sign in with Google</span></a>
    <div class="fine">Restricted to @foundersinsuranceagency.com accounts.</div>
  </div>
</body>
</html>
