{% extends "base.html" %}
{% block title %}AEP{% endblock %}

{% block styles %}
<style>
  /* Founders Green (--green, #65BB84) is 2.34:1 on white -- fill only, never
     text. Text that must read as "good" uses --green-dim, the portal's existing
     darkened green (#13612E light / #3E8E63 dark), so it stays readable in both
     themes. Do not hardcode a hex here: a fixed dark green vanishes on the dark
     card, and a fixed light one vanishes on the white one. */
  .pl { --pl-good: var(--green-dim); font-size: 17px; }
  .pl-head { padding: 20px 0 8px; }
  .pl-big { font-size: 28px; font-weight: 700; color: var(--ivory-bright); }
  .pl-sub { color: var(--slate); font-size: 15px; margin-top: 4px; }
  .pl-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .pl-card h3 { margin: 0 0 4px; font-size: 18px; color: var(--ivory-bright); }
  .pl-card.urgent { border-left: 4px solid var(--gold); }
  .pl-row { display: flex; justify-content: space-between; align-items: center;
            min-height: 46px; padding: 8px 0; border-top: 1px solid var(--border);
            color: var(--ivory); }
  .pl-btn { min-height: 46px; padding: 0 18px; font-size: 16px;
            border-radius: var(--radius-sm); background: var(--gold);
            color: var(--on-gold); border: 0; cursor: pointer; }
  .pl-empty { color: var(--slate); padding: 28px 0; }

  /* Rows painted by pipeline.js. The row wraps to a stack on a phone so the
     call button never falls off the right edge. */
  .pl-row { flex-wrap: wrap; gap: 10px 16px; }
  .pl-who { display: flex; flex-direction: column; gap: 2px; min-width: 200px; flex: 1 1 240px; }
  .pl-name { font-size: 17px; font-weight: 600; color: var(--ivory-bright);
             text-decoration: none; min-height: 24px; }
  .pl-name:hover, .pl-name:focus { text-decoration: underline; }
  .pl-reason { font-size: 15px; color: var(--ivory); }
  .pl-meta { font-size: 13px; color: var(--slate); }
  .pl-do { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .pl-tel { display: inline-flex; align-items: center; min-height: 46px;
            padding: 0 16px; font-size: 17px; font-weight: 600;
            border-radius: var(--radius-sm); background: var(--surface-low);
            color: var(--gold); text-decoration: none; }
  .pl-tel:hover, .pl-tel:focus { text-decoration: underline; }
  .pl-nophone { font-size: 15px; color: var(--slate); }
  .pl-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .pl-act { min-height: 46px; padding: 0 14px; font-size: 15px;
            border-radius: var(--radius-sm); background: var(--surface-low);
            color: var(--ivory); border: 1px solid var(--border); cursor: pointer; }
  .pl-act:hover:not(:disabled) { border-color: var(--gold); }
  .pl-act:disabled { opacity: .55; cursor: default; }
  .pl-act.pl-on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
  .pl-act.pl-done.pl-on, .pl-settled-row .pl-act.pl-done { color: var(--pl-good); }
  .pl-say { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--slate); }
  .pl-say:empty { display: none; }
  .pl-more { margin: 10px 0 0; }
  .pl-settled-row .pl-name { color: var(--pl-good); }
</style>
{% endblock %}

{% block content %}
<div class="pl">
  <div class="pl-head">
    <div class="pl-big" id="pl-settled">Loading&hellip;</div>
    <div class="pl-sub" id="pl-pace"></div>
  </div>
  <main id="pl-main"></main>
</div>
<script src="{{ url_for('static', filename='js/pipeline.js') }}"></script>
{% endblock %}
