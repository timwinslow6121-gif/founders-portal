<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEP workspace v4, retiree.report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#ECEFF3;--surface:#FFFFFF;--sunk:#F4F6F8;--ink:#14202C;--ink-2:#3F4D5B;--ink-3:#56636F;
  --line:#D3DAE1;--line-2:#E4E9EE;--accent:#1B5DA8;--accent-ink:#FFFFFF;--accent-soft:#E1ECF8;
  --red:#A8261C;--red-soft:#FBE8E6;--amber:#7A5200;--amber-soft:#FFF1CC;--green:#1F6B3A;--green-soft:#E1F2E6;
  --renewal:#4A3F8C;--renewal-soft:#ECE9F7;--lead:#0D6B6B;--lead-soft:#DFF2F1;
  --side:#14202C;--side-ink:#C9D3DD;--side-hi:#FFFFFF;--side-act:#24384D;
  --s-contact:#3C7BC6;--s-sched:#5A4CA8;--s-decide:#B07D00;--s-sub:#13807F;--s-done:#2E7A48;
  --shadow:0 1px 0 rgba(20,32,44,.05),0 4px 12px -8px rgba(20,32,44,.3);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F151C;--surface:#172029;--sunk:#121A22;--ink:#E7EDF3;--ink-2:#B6C2CE;--ink-3:#9AA7B3;
    --line:#2A3643;--line-2:#212C37;--accent:#6FA8EA;--accent-ink:#0B1520;--accent-soft:#1B2E45;
    --red:#F08A80;--red-soft:#3A1E1C;--amber:#F2C25B;--amber-soft:#3A2E12;--green:#7ACB94;--green-soft:#16301F;
    --renewal:#B7ACF0;--renewal-soft:#28233F;--lead:#6FD1CD;--lead-soft:#123332;
    --side:#0B1117;--side-ink:#A9B6C2;--side-hi:#FFFFFF;--side-act:#1D2C3B;
    --s-contact:#5A95DB;--s-sched:#8A7BDB;--s-decide:#D9A42A;--s-sub:#2FA3A1;--s-done:#4FA36C;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 16px -10px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F151C;--surface:#172029;--sunk:#121A22;--ink:#E7EDF3;--ink-2:#B6C2CE;--ink-3:#9AA7B3;
  --line:#2A3643;--line-2:#212C37;--accent:#6FA8EA;--accent-ink:#0B1520;--accent-soft:#1B2E45;
  --red:#F08A80;--red-soft:#3A1E1C;--amber:#F2C25B;--amber-soft:#3A2E12;--green:#7ACB94;--green-soft:#16301F;
  --renewal:#B7ACF0;--renewal-soft:#28233F;--lead:#6FD1CD;--lead-soft:#123332;
  --side:#0B1117;--side-ink:#A9B6C2;--side-hi:#FFFFFF;--side-act:#1D2C3B;
  --s-contact:#5A95DB;--s-sched:#8A7BDB;--s-decide:#D9A42A;--s-sub:#2FA3A1;--s-done:#4FA36C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 16px -10px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
small{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 18px;color:var(--side-hi)}
.mark{width:32px;height:32px;border-radius:8px;background:#2F74C4;flex:none;position:relative}
.mark::after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:3px;border-radius:2px;background:#fff;box-shadow:0 -6px 0 #fff,0 -12px 0 #fff}
.brand b{font-family:var(--display);font-size:18px;display:block;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--side-ink);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--side-ink);padding:10px 10px;border-radius:8px;text-align:left;min-height:44px;white-space:nowrap}
.nav button:hover{color:var(--side-hi);background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--side-act);color:var(--side-hi);font-weight:700}
.nav .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px}
.side-foot{padding:12px 10px 16px}
.collapse{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--side-ink);padding:10px;border-radius:8px;width:100%;min-height:44px;white-space:nowrap}
.collapse:hover{color:var(--side-hi)}
.app.slim .side{width:64px}
.app.slim .side .lbl,.app.slim .brand div,.app.slim .nav .cnt{display:none}
.app.slim .collapse svg{transform:rotate(180deg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* header */
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.row-a{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;align-items:center;justify-content:center}
.title h1{font-size:21px;letter-spacing:-.01em}
.season{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:3px}
.season .bar{width:150px;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.season .bar i{display:block;height:100%;background:var(--accent)}
.search{position:relative;margin-left:auto;flex:0 1 330px;min-width:200px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;padding-left:36px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:40px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;min-height:40px;font-weight:700;color:var(--ink-2);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.btn.ghost{background:transparent}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-2);border-top:1px solid var(--line-2)}
.metric{border:0;background:var(--surface);text-align:left;padding:10px 16px 11px;position:relative;min-height:62px}
.metric b{font-family:var(--display);font-size:26px;line-height:1;display:block;letter-spacing:-.02em}
.metric span{display:block;font-size:13px;color:var(--ink-2);margin-top:3px}
.metric.hot b{color:var(--red)}
.metric.zero b{color:var(--ink-3)}
.metric:hover{background:var(--sunk)}
.metric[aria-pressed="true"]{background:var(--accent-soft)}
.metric[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}

/* filters */
.row-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;border-top:1px solid var(--line-2)}
.row-c .field{min-height:36px;padding:5px 8px;font-size:14px}
.check{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);padding:0 4px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700}
.reset{margin-left:auto}

/* inline lead form */
.leadform{display:none;border-top:1px solid var(--line-2);background:var(--sunk);padding:14px 20px}
.leadform.on{display:block}
.lf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lf-grid label span,.lbl{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:3px}
.lf-grid .field{width:100%}
.lf-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.lf-err{color:var(--red);font-weight:700;font-size:14px}

.content{padding:16px 20px 48px}

/* chips & shared */
.tier{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.6}
.tier.t1{background:var(--red-soft);color:var(--red)}
.tier.t2{background:var(--amber-soft);color:var(--amber)}
.tier.t3{background:var(--sunk);color:var(--ink-3);border:1px solid var(--line-2)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;line-height:1.6;white-space:nowrap}
.tag.renewal{background:var(--renewal-soft);color:var(--renewal)}
.tag.lead{background:var(--lead-soft);color:var(--lead)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.muted{background:var(--sunk);color:var(--ink-3)}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.carrier{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em}
.stall{color:var(--red);font-weight:700}
.call{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap;border-radius:6px;padding:2px 4px;margin-left:-4px}
.call:hover{background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.empty{padding:16px;color:var(--ink-3);font-size:14px}
.agent{font-size:12px;font-weight:700;color:var(--ink-3)}

/* today */
.today-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.today-head h2{font-size:26px;letter-spacing:-.02em}
.today-head p{margin:3px 0 0;color:var(--ink-2)}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px;align-items:start}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.sec>header h3{font-size:16px}
.sec>header p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.sec>header b{font-family:var(--display);font-size:22px}
.sec>header b.hot{color:var(--red)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2)}
.qrow:first-of-type{border-top:0}
.q-l{min-width:0}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-name{border:0;background:none;padding:0;font-weight:700;font-size:15px;text-align:left}
.q-name:hover{color:var(--accent);text-decoration:underline}
.q-sub{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:2px}
.q-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line-2);background:var(--sunk);padding:9px;font-weight:700;color:var(--accent)}
details.camp{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.camp summary{padding:12px 14px;cursor:pointer;font-weight:700;font-family:var(--display);font-size:16px}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px;padding:0 14px 14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line-2);font-size:14px}
.kv b{font-family:var(--display)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin:2px 0 8px}
.meter i{display:block;height:100%;background:var(--accent)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:280px}
.col.over{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.col>header{padding:10px 12px;border-bottom:1px solid var(--line);border-top:4px solid var(--c);border-radius:11px 11px 0 0;background:var(--surface)}
.col>header .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col>header h3{font-size:15px}
.col>header .n{font-family:var(--display);font-size:20px;font-weight:700}
.col>header small{display:block;font-size:13px;margin-top:1px}
.cards{padding:7px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px 9px;box-shadow:var(--shadow);cursor:grab}
.card:hover{border-color:var(--ink-3)}
.card.dragging{opacity:.4}
.card.is-stalled{box-shadow:inset 3px 0 0 var(--red),var(--shadow)}
.c-top{display:flex;align-items:center;gap:6px}
.c-top .kebab{margin-left:auto}
.kebab{border:0;background:transparent;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.kebab:hover{background:var(--sunk);color:var(--ink)}
.c-name{display:block;border:0;background:none;padding:0;font-weight:700;font-size:15px;text-align:left;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name:hover{color:var(--accent);text-decoration:underline}
.c-why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.c-status{font-size:13px;color:var(--ink-2);margin-top:5px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:5px;font-size:13px}
.colfoot{margin:auto 7px 7px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px;color:var(--accent);font-weight:700;font-size:14px}
.note{margin:0 0 10px;color:var(--ink-2);font-size:14px}

/* table */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
th{font-size:13px;color:var(--ink-3);font-weight:700;background:var(--sunk)}
th button{background:none;border:0;padding:0;font-weight:700;color:inherit}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px}
tbody tr:hover{background:var(--sunk)}
td input[type=checkbox],th input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
td .wrap{white-space:normal;min-width:190px;display:block}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.bulk .field{min-height:34px;padding:4px 8px;font-size:14px}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:14px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.yes{color:var(--green);font-weight:700}
.no{color:var(--ink-3)}

/* after sale */
.ms{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:2px 10px 2px 6px;font-size:12px;font-weight:700;min-height:28px}
.ms i{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--line)}
.ms.done{color:var(--green);border-color:transparent;background:var(--green-soft)}.ms.done i{background:var(--green)}
.ms.due{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}.ms.due i{background:var(--amber)}
.ms.problem{color:var(--red);background:var(--red-soft);border-color:var(--red)}.ms.problem i{background:var(--red)}
.ms.wait{color:var(--ink-3)}.ms.wait i{background:transparent;border:2px dashed var(--ink-3)}
.ms.later{color:var(--ink-3)}.ms.later i{background:transparent;border:2px solid var(--line)}
button.ms:hover{filter:brightness(.96)}
.lede{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.alert b{color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);padding:10px 12px}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;min-width:240px;background:var(--line-2)}
.stack i{display:block;height:100%;background:var(--c)}
tr.clickable{cursor:pointer}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;z-index:20;box-shadow:-10px 0 30px -18px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.dh{position:sticky;top:0;background:var(--surface);padding:14px 18px 12px;border-bottom:1px solid var(--line);z-index:1}
.dh .r1{display:flex;justify-content:space-between;align-items:start;gap:10px}
.dh h2{font-size:24px;margin-top:4px}
.dh p{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
.x{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;flex:none}
.dsec{padding:13px 18px;border-bottom:1px solid var(--line-2)}
.dsec h3{font-size:15px;margin-bottom:8px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 3px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;min-height:44px;line-height:1.2}
.step.past{background:var(--sunk)}
.step.cur{background:var(--c);border-color:var(--c);color:#fff}
.step:not(.cur):hover{border-color:var(--c);color:var(--ink)}
.reason{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.reason span:last-child{font-family:var(--display);font-weight:700;color:var(--ink-3)}
.gate{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.gate:first-of-type{border-top:0}
.gate .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ic.ok{background:var(--green-soft);color:var(--green)}
.ic.bad{background:var(--red-soft);color:var(--red)}
.ic.mid{background:var(--amber-soft);color:var(--amber)}
.gate small{display:block}
.facts{display:grid;grid-template-columns:118px 1fr;gap:4px 10px;font-size:14px;margin:0}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:6px 0;font-size:14px;border-top:1px solid var(--line-2)}
.tl li:first-child{border-top:0}

.note-in{display:flex;gap:6px;margin-top:8px}

.pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 36px -14px rgba(0,0,0,.4);padding:5px;min-width:200px;display:none}
.pop.on{display:block}
.pop .hd{font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 10px 3px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;min-height:38px}
.pop button:hover,.pop button:focus-visible{background:var(--sunk)}
.pop button[disabled]{color:var(--ink-3);cursor:default;background:transparent}
.pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}

/* modal */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,94vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.mh{padding:18px 20px 4px}
.mh h2{font-size:21px}
.mh p{margin:5px 0 0;color:var(--ink-2);font-size:14px}
.mb{padding:10px 20px;display:flex;flex-direction:column;gap:12px}
.mb .field{width:100%}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px}
.opt small{display:block}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:14px}
.chk input{accent-color:var(--accent)}
.callout{background:var(--accent-soft);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}

/* triage rules */
.rules{max-width:1180px}
.rhead{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{font-size:26px;letter-spacing:-.02em}
.rhead p{margin:3px 0 0;color:var(--ink-2);max-width:70ch}
.rstat{display:flex;flex-direction:column;gap:3px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.rcard>header{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.rcard>header h3{font-size:17px}
.rcard>header p{margin:3px 0 0;font-size:14px;color:var(--ink-2);max-width:80ch}
.rbody{padding:12px 14px}
.addrow{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 14px;background:var(--sunk);border-top:1px solid var(--line-2)}
.counties{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;max-width:600px}
.counties legend{padding:0;margin-bottom:3px}
.counties label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:14px}
.counties input{accent-color:var(--accent)}
.shp-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:10px}
.src{font-size:13px;color:var(--ink-3);margin:10px 0}
select.unrated{border-color:var(--amber);color:var(--amber)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.why{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.why small{font-size:13px}
.ovr{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.ovr-row{display:flex;gap:6px;flex-wrap:wrap}
.ovr-row .field{flex:1 1 150px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;width:min(520px,92vw)}
.toast{background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:rise .25s ease}
.toast b{display:block}
.toast.warn{background:var(--red);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1180px){
}
@media (max-width:860px){
  .side{position:fixed;left:0;z-index:25;transform:translateX(-100%);transition:transform .2s;width:240px}
  .app.nav-open .side{transform:none}
  .app.slim .side{width:240px}

  .qrow{grid-template-columns:1fr}
  .q-acts{justify-content:flex-start}
  .two{grid-template-columns:1fr}

}

<body>

</div>

<script>
/* ============ utilities ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DAY = 864e5;
const TODAY = new Date(2026, 9, 27);            // demo date, AEP day 13
const D = (m, d, y = 2026) => new Date(y, m - 1, d);
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const diff = (a, b) => Math.round((b - a) / DAY);
const fmt = d => d ? d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '';
const fmtDay = d => d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
const timeOf = d => d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
const sameDay = (a, b) => !!a && !!b && a.toDateString() === b.toDateString();
const maxDate = (a, b) => a > b ? a : b;
const dayLabel = d => sameDay(d, TODAY) ? 'Today' : sameDay(d, addDays(TODAY, 1)) ? 'Tomorrow' : fmtDay(d);
const store = {get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }};

let seed = 20261027;
function R(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pick = a => a[Math.floor(R() * a.length)];
const int = (a, b) => a + Math.floor(R() * (b - a + 1));
const wpick = pairs => { const tot = pairs.reduce((s, p) => s + p[1], 0); let r = R() * tot; for (const [v, w] of pairs){ if ((r -= w) < 0) return v; } return pairs[pairs.length - 1][0]; };

const ICON = {
  today:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  board:'<rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/>',
  table:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  after:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',

  rules:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>'
};
const svg = (k, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const dots = '<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

/* ============ domain ============ */
const STAGES = [
  {id:'contact',   name:'Needs contact',  hint:'Letter or blast sent, or tried by phone or text', c:'var(--s-contact)'},
  {id:'scheduled', name:'Scheduled',      hint:'Booked in Acuity or Calendly', c:'var(--s-sched)'},
  {id:'deciding',  name:'Met, deciding',  hint:'SOA on file, no decision yet', c:'var(--s-decide)'},
  {id:'submitted', name:'Submitted',      hint:'Waiting on carrier confirmation', c:'var(--s-sub)'},
  {id:'done',      name:'Done for 2027',  hint:'Enrolled, kept plan, or closed', c:'var(--s-done)'}
];
const S = Object.fromEntries(STAGES.map((s, i) => [s.id, {...s, i}]));
const OUTCOME = {enrolled:'Enrolled', kept:'Kept current plan', lost:'Closed'};

const AGENTS = [
  {id:'timbo',   name:'Timbo',   office:'Charlotte',   renewals:500,  leads:26, lag:1,    soaGap:0,   me:true},
  {id:'dana',    name:'Dana',    office:'Kannapolis',  renewals:1440, leads:40, lag:1.45, soaGap:.03},
  {id:'marcus',  name:'Marcus',  office:'Salisbury',   renewals:885,  leads:25, lag:1.1,  soaGap:.09},
  {id:'priya',   name:'Priya',   office:'Concord',     renewals:620,  leads:20, lag:.85,  soaGap:0},
  {id:'luis',    name:'Luis',    office:'Albemarle',   renewals:290,  leads:10, lag:.75,  soaGap:0},
  {id:'karen',   name:'Karen',   office:'China Grove', renewals:795,  leads:25, lag:1.2,  soaGap:.04},
  {id:'wes',     name:'Wes',     office:'Mooresville', renewals:685,  leads:20, lag:1,    soaGap:.02},
  {id:'monique', name:'Monique', office:'Rock Hill',   renewals:572,  leads:18, lag:.95,  soaGap:0}
];
const AG = Object.fromEntries(AGENTS.map(a => [a.id, a]));
const ME = 'timbo';

const FIRST = ['Barbara','Betty','Carol','Dorothy','Frances','Gloria','Helen','Joyce','Judy','Linda','Margaret','Martha','Nancy','Patricia','Peggy','Ruth','Sandra','Shirley','Wanda','Brenda','Donna','Janet','Faye','Evelyn','Charles','Donald','Earl','Frank','Gary','George','Harold','Jerry','Kenneth','Larry','Melvin','Ronald','Roger','Wayne','Willie','Dennis','Ray','Curtis','Billy','Jimmy','Clyde','Vernon','Loretta','Bobby','Glenda','Tommy'];
const LAST = ['Allen','Barnhardt','Beaver','Blackwelder','Bost','Brown','Cline','Cook','Dayvault','Deal','Earnhardt','Eudy','Fink','Hartsell','Helms','Honeycutt','Ketner','Lefler','Linker','Lyerly','McLaughlin','Misenheimer','Moose','Overcash','Peeler','Plyler','Ritchie','Safrit','Shive','Sides','Smith','Starnes','Thompson','Troutman','Walker','Williams','Yost','Barringer','Cress','Furr','Jackson','Robinson','Little','Graham','Hinson','Mauney'];
const LOCS = [['Charlotte','Mecklenburg','NC',24],['Concord','Cabarrus','NC',12],['Kannapolis','Cabarrus','NC',12],['Salisbury','Rowan','NC',10],['China Grove','Rowan','NC',6],['Harrisburg','Cabarrus','NC',5],['Huntersville','Mecklenburg','NC',5],['Matthews','Mecklenburg','NC',4],['Mooresville','Iredell','NC',5],['Albemarle','Stanly','NC',5],['Monroe','Union','NC',4],['Rock Hill','York','SC',5],['Fort Mill','York','SC',3]];
const COUNTIES = [...new Set(LOCS.map(l => `${l[1]}|${l[2]}`))].map(s => s.split('|')).sort((a, b) => a[0].localeCompare(b[0]));
const CARRIERS = ['Aetna','BCBS NC','Devoted','Humana','UHC','Wellcare'];
// Humana 335-002 in Cabarrus comes from Timbo. Every other plan ID and change note is a placeholder.
const PLANS = [
  {carrier:'Humana',   pid:'335-002', name:'Humana PPO 335-002',         type:'MAPD', change:null, rating:null},
  {carrier:'Humana',   pid:'101-001', name:'Humana HMO 101-001',         type:'MAPD', change:'PCP copay $0 to $15', rating:2},
  {carrier:'Humana',   pid:'201-000', name:'Humana PDP 201-000',         type:'PDP',  change:'Drug deductible goes up', rating:2},
  {carrier:'Humana',   pid:'336-001', name:'Humana MA-only PPO 336-001', type:'MA',   change:'No meaningful changes', rating:3},
  {carrier:'Humana',   pid:'221-004', name:'Humana Dual 221-004',        type:'DSNP', change:null, rating:null},
  {carrier:'UHC',      pid:'118-003', name:'UHC PPO 118-003',            type:'MAPD', change:'Dental allowance cut from $2,000 to $500', rating:2},
  {carrier:'UHC',      pid:'120-001', name:'UHC HMO-POS 120-001',        type:'MAPD', change:'Specialist copay up $10', rating:3},
  {carrier:'UHC',      pid:'119-002', name:'UHC MA-only PPO 119-002',    type:'MA',   change:'Small copay adjustments only', rating:3},
  {carrier:'UHC',      pid:'220-001', name:'UHC Dual 220-001',           type:'DSNP', change:'OTC allowance reduced', rating:2},
  {carrier:'Aetna',    pid:'150-002', name:'Aetna PPO 150-002',          type:'MAPD', change:'Out-of-pocket max up $1,200', rating:2},
  {carrier:'Aetna',    pid:'151-001', name:'Aetna MA-only PPO 151-001',  type:'MA',   change:null, rating:null},
  {carrier:'Wellcare', pid:'160-004', name:'Wellcare HMO 160-004',       type:'MAPD', change:'Premium up $18 a month', rating:3},
  {carrier:'Wellcare', pid:'161-000', name:'Wellcare PDP 161-000',       type:'PDP',  change:'A common drug moves from tier 3 to tier 4', rating:2},
  {carrier:'Devoted',  pid:'170-001', name:'Devoted HMO 170-001',        type:'MAPD', change:'No meaningful changes', rating:3},
  {carrier:'BCBS NC',  pid:'180-003', name:'Blue Medicare PPO 180-003',  type:'MAPD', change:'Preferred pharmacy list narrowed', rating:null},
  {carrier:'BCBS NC',  pid:'Supp G',  name:'Blue Med Supp G + PDP',      type:'Supp', change:'Rate notice not out yet', rating:null}
];
const INDIV = PLANS.filter(p => ['MAPD', 'PDP', 'Supp'].includes(p.type));
const MAONLY = PLANS.filter(p => p.type === 'MA');
const DSNP = PLANS.filter(p => p.type === 'DSNP');
const RULES = {
  v:1, status:'final', updated:D(9, 28),
  sar:[{pid:'335-002', counties:['Cabarrus']}],
  shp:{on:true, start:D(10, 12), end:D(10, 30)},
  ratings:Object.fromEntries(PLANS.map(p => [p.pid, p.rating])),
  leadSep:false
};
const bump = () => { RULES.v++; };
const planOf = pid => PLANS.find(p => p.pid === pid);
const isSar = (plan, county) => RULES.sar.some(r => r.pid === plan.pid && r.counties.includes(county));
const changeOf = c => c.track === 'lead' ? c.situation : isSar(c.plan, c.county) ? `Plan not offered in ${c.county} County for 2027` : (c.plan.change || 'Changes not reviewed yet');
const shpDaysLeft = () => diff(TODAY, RULES.shp.end);
const shpOpen = () => RULES.shp.on && shpDaysLeft() >= 0;
const shpPending = c => !!c.shp && !c.shpDone && RULES.shp.on;
const LETTERS = {A:'Letter A, staying about the same', B:'Letter B, your plan is changing', C:'Letter C, your plan is ending'};
const DECIDING_NOTES = ['Talking it over with daughter','Checking if cardiologist is in network','Comparing two plans','Wants to think about it','Checking a drug price at the pharmacy'];
const PROBLEMS = ['Enrolled by another agent','Member cancelled with carrier','Carrier rejected, address mismatch'];
const MS_KEYS = [['submitted','Submitted'],['accepted','Carrier confirmed'],['welcome','Welcome sent'],['idcard','ID card check'],['oep','OEP check-in'],['charge','Chargeback window'],['bday','Birthday card']];

function autoTier(c){
  if (c.track === 'renewal'){
    if (isSar(c.plan, c.county)) return {tier:1, rank:1, reasons:[{t:'Plan ending in county', k:'red', d:`${c.plan.carrier} ${c.plan.pid} is not offered in ${c.county} County for 2027.`}]};
    if (shpPending(c)){
      const left = shpDaysLeft();
      const t = left < 0 ? 'State opt-out window closed' : left === 0 ? 'State opt-out due today' : `State opt-out, ${left} days left`;
      return {tier:1, rank: left <= 7 ? 0 : 2, reasons:[{t, k:'red', d:`NC State Health Plan retiree on the 70/30 Plan. Must call the State during open enrollment (${fmt(RULES.shp.start)} to ${fmt(RULES.shp.end)}) to opt out of the Humana group PPO to keep the 70/30 and their MA-only plan.`}]};
    }
    const extra = c.shp ? [{t:'State retiree, opt-out confirmed', k:'green'}] : [];
    const rt = RULES.ratings[c.plan.pid];
    if (rt === 3) return {tier:3, rank:6, reasons:[{t:'Little plan change', k:'muted', d:c.plan.change}, ...extra]};
    if (rt === 2) return {tier:2, rank:4, reasons:[{t:'Plan changes to review', k:'amber', d:c.plan.change}, ...extra]};
    return {tier:2, rank:5, reasons:[{t:'Plan not rated yet', k:'muted', d:'Counts as Tier 2 until the plan is rated in Triage rules.'}, ...extra]};
  }
  const sep = c.situation === 'Losing employer coverage' || c.situation === 'Moved into the area';
  if (sep && RULES.leadSep) return {tier:1, rank:3, reasons:[{t:c.situation, k:'red', d:'Special Enrollment Period lead'}, {t:c.source, k:'muted'}]};
  return {tier:2, rank:5, reasons:[{t:c.situation, k: sep ? 'amber' : 'muted'}, {t:c.source, k:'muted'}]};
}
function tierInfo(c){
  if (c._tv === RULES.v) return c._ti;
  const a = autoTier(c);
  const ti = c.override ? {tier:c.override.tier, rank:a.rank, manual:true, reasons:[{t:`Set to Tier ${c.override.tier} by hand`, k:'blue', d:c.override.note || 'No note'}, ...a.reasons]} : a;
  c._tv = RULES.v; c._ti = ti;
  return ti;
}
const tierOf = c => tierInfo(c).tier;
const tierChip = c => { const t = tierInfo(c); return `<span class="tier t${t.tier}" title="${t.manual ? 'Set by hand' : 'Set by triage rules'}">Tier ${t.tier}${t.manual ? '*' : ''}</span>`; };
const trackTag = c => c.track === 'renewal' ? '<span class="tag renewal">Renewal</span>' : '<span class="tag lead">New lead</span>';
const topReason = c => { const r = tierInfo(c).reasons[0]; return r ? `<span class="tag ${r.k}">${esc(r.t)}</span>` : ''; };
const priSort = (a, b) => tierOf(a) - tierOf(b) || tierInfo(a).rank - tierInfo(b).rank;
const telHref = p => 'tel:+1' + p.replace(/\D/g, '');
const callLink = c => c.phone ? `<a class="call" href="${telHref(c.phone)}" title="Call with Quo">${svg('phone', 'sm')}${esc(c.phone)}</a>` : '<span class="no">No phone</span>';

/* ============ data generation ============ */
function viaFor(plan){
  if (plan.carrier === 'UHC' && R() < .5) return 'Jarvis (UHC)';
  if (plan.carrier === 'Humana' && R() < .5) return 'Vantage (Humana)';
  return wpick([['MedicareCenter', 3], ['HealthSherpa', 1]]);
}
function locFor(agent){
  if (R() < .55) return LOCS.find(l => l[0] === agent.office);
  return wpick(LOCS.map(l => [l, l[3]]));
}
function baseRecord(id, agent, track, loc){

function makeRenewal(id, agent){

    consent:{rvm:R() < .55, sms:R() < .4, email:R() < .45}, inbound:false});

  if (shp && S[c.stage].i >= 2 && R() < .6){

const SIT_W = {'Losing employer coverage':45, 'Turning 65':35, 'Moved into the area':30, 'Shopping for 2027':10};
const SRC_W = {'Referral':15, 'Pharmacy walk-in':15, 'Community event':10, 'Website':5, 'Billboard':5};
function fillStage(c, stage, agent){
  c.stage = stage;
  const T = c.touches;
  if (c.letterDate) T.push({d:c.letterDate, k:'Letter', t:`${LETTERS[c.letter]} mailed`});
  if (c.track === 'renewal' && c.consent.rvm && R() < .8) T.push({d:D(10, 8), k:'Blast', t:'Ringless voicemail blast'});
  const phoneFirst = agent.me || c.city === 'Charlotte';
  const pickMode = () => phoneFirst ? wpick([['Phone', 55], ['In person', 25], ['Zoom', 15], ['Group session', 5]]) : wpick([['In person', 55], ['Phone', 20], ['Zoom', 10], ['Group session', 15]]);
  const soaAt = (d, m) => ({d, method: m === 'In person' || m === 'Group session' ? 'Paper, scanned to vault' : wpick([['MedicareCenter', 3], ['HealthSherpa', 1]]), scope: c.plan.type === 'PDP' ? ['PDP'] : c.plan.type === 'MA' ? ['MA-only'] : ['MAPD', 'PDP']});

  if (stage === 'contact'){
    const tried = R() < .5 ? int(1, 3) : 0;
    c.attempts = tried;
    if (!tried){ c.since = c.letterDate || D(10, 1); return finish(c); }
    c.firstTry = addDays(TODAY, -int(0, 9)); c.since = c.firstTry;
    for (let i = 0; i < tried; i++){
      const d = addDays(c.firstTry, Math.min(diff(c.firstTry, TODAY), i * 2));
      const sms = c.consent.sms && i % 2 === 1;
      T.push({d, k: sms ? 'Text' : 'Call', t: sms ? 'Texted booking link, no reply' : 'Called, no answer, left voicemail'});
    }
    return finish(c);
  }
  const m = pickMode();
  if (stage === 'scheduled'){
    c.since = addDays(TODAY, -int(1, 9));
    T.push({d:c.since, k: c.track === 'renewal' ? 'Inbound' : 'Call', t: c.track === 'renewal' ? 'Called in after the member letter' : 'Reached and booked'});
    const r = R();
    const off = r < .08 ? 0 : r < .14 ? -int(1, 2) : int(1, 14);
    const d = addDays(TODAY, off); d.setHours(pick([9, 10, 11, 13, 14, 15]), pick([0, 30]));
    c.appt = {date:d, mode:m, via: R() < .6 ? 'Acuity' : 'Calendly'};
    c.intake = wpick([['Sent', 45], ['Returned', 25], ['Not sent', 30]]);
    T.push({d:c.since, k:'Booked', t:`${m} appointment set for ${fmtDay(d)}`});
    return finish(c);
  }
  const met = stage === 'deciding' ? addDays(TODAY, -int(0, 7)) : maxDate(addDays(TODAY, -int(0, 12)), D(10, 15));
  const gap = (stage === 'deciding' || stage === 'submitted') && R() < agent.soaGap;
  c.soa = gap ? null : soaAt(met, m);
  c.intake = 'Returned';
  c.meetMode = m;
  if (m === 'Phone' || m === 'Zoom') c.recordings = int(1, 2);
  T.push({d:addDays(met, -int(2, 8)), k:'Booked', t:`${m} appointment booked`});
  if (c.soa) T.push({d:met, k:'SOA', t:`Scope of Appointment recorded (${c.soa.method})`});

  if (stage === 'deciding'){
    c.since = met; c.note = pick(DECIDING_NOTES);
    T.push({d:met, k:'Met', t:`Appointment held. ${c.note}`});
    return finish(c);
  }
  if (stage === 'submitted' || (stage === 'done' && R() < .5)){
    const np = pick((c.plan.type === 'DSNP' ? DSNP : c.shp ? MAONLY : INDIV).filter(p => !isSar(p, c.county)));
    const a = {carrier:np.carrier, plan:np.name, via:viaFor(np), date:met, confirmed:false, problem:null};
    c.app = a;
    T.push({d:met, k:'App', t:`Application submitted for ${np.name} via ${a.via}`});
    if (stage === 'submitted'){
      c.since = met;
      a.confirmed = false;
    } else {
      a.confirmed = true; c.outcome = 'enrolled';
      c.since = addDays(met, int(2, 5)) > TODAY ? new Date(TODAY) : addDays(met, int(2, 5));
      T.push({d:c.since, k:'Carrier', t:'Carrier confirmed enrollment'});
      if (R() < .07){ a.problem = pick(PROBLEMS); T.push({d:TODAY, k:'Alert', t:a.problem}); }
    }
    buildAfter(c);
    return finish(c);
  }
  c.since = maxDate(addDays(TODAY, -int(0, 12)), met);
  if (c.track === 'renewal' && R() < .82){
    c.outcome = 'kept';
    T.push({d:c.since, k:'Met', t:'Reviewed 2027 changes, staying on current plan'});
  } else {
    c.outcome = 'lost';
    T.push({d:c.since, k:'Closed', t: pick(['Not a fit, referred to SHIIP counselor', 'Staying with their current agent', 'Moved out of the NC/SC service area'])});

}

function stallOf(c){

  switch (c.stage){

    case 'deciding': return d >= 3 ? `Undecided ${d} days` : null;
    case 'submitted': return c.app && !c.app.confirmed && !c.app.problem && d >= 10 ? `Unconfirmed ${d} days` : null;
  }

}

      return c.letterDate ? `Letter ${c.letter} mailed ${fmt(c.letterDate)}, not called` : c.track === 'lead' ? 'New, not contacted' : `Letter ${c.letter} not mailed yet`;
    case 'scheduled':

      return `${dayLabel(c.appt.date)} ${timeOf(c.appt.date)}, ${c.appt.mode.toLowerCase()}`;
    case 'deciding':
      return st ? `<span class="stall">${st}</span>, ${esc(c.note.toLowerCase())}` : `Met ${fmt(c.since)}, ${esc(c.note.toLowerCase())}`;
    case 'submitted':

  $('#view').innerHTML = `

        <div><div class="kv"><span>Renewals reached one-on-one</span><b>${reached} / ${ren.length}</b></div><div class="meter"><i style="width:${ren.length ? reached / ren.length * 100 : 0}%"></i></div>

}

/* ============ Board ============ */
function card(c){
  const st = stallOf(c) || (c.app && c.app.problem);
  const needSoa = (c.stage === 'deciding' || c.stage === 'submitted') && !c.soa;
  const soaOk = c.soa && (c.stage === 'scheduled' || c.stage === 'deciding' || c.stage === 'submitted');
  return `<article class="card ${st ? 'is-stalled' : ''}" draggable="true" data-card="${c.id}">
    <div class="c-top"><span class="carrier">${esc(c.plan.carrier)}</span>${tierChip(c)}${state.agent === 'all' ? `<span class="agent">${AG[c.agent].name}</span>` : ''}
      <button type="button" class="kebab" data-cardmenu="${c.id}" aria-label="Move or open ${esc(c.name)}" aria-haspopup="menu">${dots}</button></div>
    <button type="button" class="c-name" data-open="${c.id}">${esc(c.name)}</button>
    <div class="c-why">${topReason(c)}${c.track === 'lead' ? trackTag(c) : ''}</div>
    <div class="c-status">${statusLine(c)}</div>
    <div class="c-foot">${callLink(c)}${needSoa ? '<span class="tag red">No SOA</span>' : soaOk ? '<span class="tag green">SOA</span>' : ''}</div>
  </article>`;
}
function renderBoard(){
  const L = list({skipStage:true});
  const PER = 12;
  $('#view').innerHTML = `
    <p class="note">Drag a card, or use its menu, to move it. Each column shows stalled cards first, then by tier. Use the column link to see everyone.</p>
    <div class="board">${STAGES.map(s => {
      const items = L.filter(c => c.stage === s.id).sort((a, b) => (!!stallOf(b) - !!stallOf(a)) || priSort(a, b));
      const st = items.filter(stallOf).length;
      let sub = st ? `<span class="stall">${st} stalled</span>` : esc(s.hint);
      if (s.id === 'done'){ const k = o => items.filter(c => c.outcome === o).length; sub = `${k('enrolled')} enrolled, ${k('kept')} kept, ${k('lost')} closed`; }
      return `<section class="col" style="--c:${s.c}" data-drop="${s.id}" aria-label="${s.name}">
        <header><div class="t"><h3>${s.name}</h3><span class="n">${items.length.toLocaleString()}</span></div><small>${sub}</small></header>
        <div class="cards">${items.slice(0, PER).map(card).join('') || '<p class="empty">Empty</p>'}</div>
        ${items.length > PER ? `<button type="button" class="colfoot" data-seeall="${s.id}">See all ${items.length.toLocaleString()} in Table</button>` : ''}
      </section>`;
    }).join('')}</div>`;
}

/* ============ Table ============ */
const COLS = [
  ['name', 'Name', c => c.name],
  ['carrier', 'Carrier', c => c.plan.carrier],
  ['tier', 'Priority', c => tierOf(c) * 10 + tierInfo(c).rank],
  ['change', 'What changed', c => changeOf(c)],
  ['stage', 'Stage', c => S[c.stage].i],
  ['days', 'Days in stage', c => diff(c.since, TODAY)],
  ['phone', 'Phone', c => c.phone],
  ['letter', 'Letter', c => c.letter || 'Z'],
  ['consent', 'Email / text OK', c => (c.consent.email ? 2 : 0) + (c.consent.sms ? 1 : 0)],
  ['soa', 'SOA', c => c.soa ? 1 : 0],
  ['agent', 'Agent', c => AG[c.agent].name]
];
function sorted(L){
  const col = COLS.find(c => c[0] === state.sort.key);
  return L.sort((a, b) => { const x = col[2](a), y = col[2](b); return (x > y ? 1 : x < y ? -1 : 0) * state.sort.dir; });
}

  <div class="tablewrap">

      ${cols.map(([k, l]) => `<th><button type="button" data-sort="${k}" ${state.sort.key === k ? `data-dir="${state.sort.dir > 0 ? '\u2191' : '\u2193'}"` : ''}>${l}</button></th>`).join('')}</tr></thead>
      <tbody>${rows.map(c => `<tr>
        <td><input type="checkbox" data-sel="${c.id}" aria-label="Select ${esc(c.name)}" ${state.sel.has(c.id) ? 'checked' : ''}></td>
        <td><button type="button" class="q-name" data-open="${c.id}">${esc(c.name)}</button><br><small>${esc(c.city)}, ${esc(c.county)} Co. ${c.st}</small></td>
        <td><span class="carrier">${esc(c.plan.carrier)}</span><br><small>${esc(c.plan.type)}</small></td>
        <td>${tierChip(c)} ${topReason(c)}</td>
        <td><span class="wrap">${esc(changeOf(c))}</span></td>
        <td><span class="dot" style="--c:${S[c.stage].c}"></span>${S[c.stage].name}<br><small>${statusLine(c)}</small></td>
        <td>${stallOf(c) ? `<span class="stall">${diff(c.since, TODAY)}</span>` : diff(c.since, TODAY)}</td>
        <td>${callLink(c)}</td>
        <td>${c.letter ? (c.letterDate ? `${c.letter}, ${fmt(c.letterDate)}` : `<span class="stall">${c.letter}, not mailed</span>`) : '<span class="no">n/a</span>'}</td>
        <td>${c.consent.email ? '<span class="yes">Email</span>' : '<span class="no">Email</span>'} / ${c.consent.sms ? '<span class="yes">Text</span>' : '<span class="no">Text</span>'}</td>
        <td>${c.soa ? '<span class="yes">On file</span>' : (c.stage === 'deciding' || c.stage === 'submitted') ? '<span class="stall">Missing</span>' : '<span class="no">None</span>'}</td>

function msCell(c, k){
  const m = c.after[k];
  const label = m.s === 'done' ? (m.d ? fmt(m.d) : 'Done') : m.s === 'due' ? 'Mark done' : m.s === 'problem' ? esc(m.note) : m.s === 'wait' ? (m.d ? `Check ${fmt(m.d)}` : 'Waiting') : fmt(m.d);
  return (m.s === 'due' || m.s === 'problem')
    ? `<td><button type="button" class="ms ${m.s}" data-ms="${k}" data-id="${c.id}"><i></i>${label}</button></td>`
    : `<td><span class="ms ${m.s}"><i></i>${label}</span></td>`;
}

/* ============ popover menu ============ */
const pop = $('#pop');
let popFor = null;
function openPop(anchor, html){
  if (popFor === anchor){ closePop(); return; }
  pop.innerHTML = html; pop.classList.add('on'); popFor = anchor;
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.right - w, window.innerWidth - w - 8); left = Math.max(8, left);
  let top = r.bottom + 4; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  pop.querySelector('button:not([disabled])')?.focus();
}
function closePop(){ pop.classList.remove('on'); popFor = null; }

/* ============ actions, moves, gates ============ */
function log(c, k, t){ c.touches.push({d:new Date(TODAY), k, t}); }
function toast(msg, title, warn){
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.innerHTML = (title ? `<b>${esc(title)}</b>` : '') + esc(msg);
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
function move(c, to, detail){
  c.stage = to; c.since = new Date(TODAY);
  const auto = {
    contact:'Back in Needs contact. Follow-up suggested in 2 days.',
    scheduled:`${c.appt ? c.appt.via : 'Acuity'} reminders attached. ${c.consent.email || c.consent.sms ? 'Meds and doctors form sent.' : 'No written consent to send the meds form, so it\u2019s added to your prep list.'}`,
    deciding:`Follow-up set for ${fmt(addDays(TODAY, 2))}. Flags as undecided after 3 days.`,
    submitted:`Carrier check set for ${fmt(addDays(TODAY, 10))}. After-sale track started.`,
    done: c.outcome === 'enrolled' ? 'Welcome message queued. ID card check Jan 6, OEP check-in Feb 10, chargeback window clears Apr 1.'
      : c.outcome === 'kept' ? 'Marked reviewed for 2027. Birthday card and next ANOC review scheduled.'
      : 'Out of the AEP queue. Kept on file for next ANOC cycle.'
  }[to];
  toast(auto, `${c.name}: ${detail || S[to].name}`);
  renderAll();
}
function requestMove(c, to){
  if (!c || to === c.stage) return;
  if (to === 'scheduled') return apptModal(c);
  if ((to === 'deciding' || to === 'submitted') && !c.soa) return soaModal(c, () => requestMove(c, to));
  if (to === 'deciding'){ c.note = c.note || 'Wants time to think'; log(c, 'Met', 'Appointment held, customer is deciding'); return move(c, 'deciding', 'Met, deciding'); }
  if (to === 'submitted') return appModal(c);
  if (to === 'done') return outcomeModal(c);
  if (to === 'contact'){ log(c, 'Moved', 'Moved back to Needs contact'); return move(c, 'contact'); }
}
function tryContact(c, kind){
  c.attempts++;
  if (c.attempts === 1 || !c.firstTry){ c.firstTry = new Date(TODAY); c.since = new Date(TODAY); }
  if (kind === 'text') log(c, 'Text', 'Texted a booking link');
  else log(c, 'Call', 'Called, no answer, left voicemail');
}
const ACTS = {
  noanswer(c){ tryContact(c, 'call'); toast(`Try ${c.attempts} logged. Next try suggested ${fmt(addDays(TODAY, 2))}.`, `${c.name}: no answer`); renderAll(); },
  text(c){
    if (!c.consent.sms){ toast('No written consent to text is on file. Call instead, or record consent first.', `Can't text ${c.name}`, true); return; }
    tryContact(c, 'text'); toast('Booking link sent. Replies land in Quo and on this record.', `${c.name}: texted`); renderAll();
  },
  book(c){ apptModal(c); },
  reschedule(c){ apptModal(c, true); },
  outcome(c){ apptOutcomeModal(c); },
  decision(c){ outcomeModal(c); },
  noshow(c){
    log(c, 'No-show', `Missed ${c.appt.mode.toLowerCase()} appointment`);
    c.appt = null; c.attempts = Math.max(c.attempts, 1); c.firstTry = c.firstTry || new Date(TODAY);
    move(c, 'contact', c.consent.sms ? 'No-show, reschedule link texted' : 'No-show, call to reschedule');
  },
  still(c){ log(c, 'Call', 'Checked in, still deciding'); c.since = new Date(TODAY); toast(`Next check-in set for ${fmt(addDays(TODAY, 2))}.`, `${c.name}: still deciding`); renderAll(); },
  confirm(c){
    c.app.confirmed = true; c.after.accepted = {s:'done', d:new Date(TODAY)}; c.after.welcome = {s:'due'};
    c.outcome = 'enrolled'; log(c, 'Carrier', 'Confirmed in carrier portal');
    move(c, 'done', 'Enrollment confirmed');
  },
  problem(c){ problemModal(c); },
  calledproblem(c){ log(c, 'Call', `Called about: ${c.app.problem}`); toast('Call logged. Use the menu to resolve it once you know what happened.', c.name); renderAll(); },
  resolved(c){ c.app.problem = null; c.app.resolved = true; c.app.confirmed = true; c.after.accepted = {s:'done', d:new Date(TODAY)}; log(c, 'Carrier', 'Problem resolved, enrollment active'); if (c.stage !== 'done'){ c.outcome = 'enrolled'; move(c, 'done', 'Resolved, enrolled'); } else { toast('Enrollment is active again.', `${c.name}: resolved`); renderAll(); } },
  lostproblem(c){ c.app.resolved = true; c.outcome = 'lost'; log(c, 'Closed', `Lost: ${c.app.problem}`); if (c.stage !== 'done') move(c, 'done', 'Closed'); else { toast('Closed as lost. Chargeback risk noted.', c.name); renderAll(); } },
  shpdone(c){ c.shpDone = true; bump(); log(c, 'State', 'Confirmed they called the State Health Plan to opt out of the Humana group PPO'); toast(`Tier now comes from their plan rating (Tier ${tierOf(c)}).`, `${c.name}: opt-out confirmed`); renderAll(); },
  shpremind(c){ log(c, 'Call', 'Reminded them to call the State Health Plan before the deadline'); toast(`Reminder logged. The State's open enrollment closes ${fmt(RULES.shp.end)}.`, c.name); renderAll(); },
  closeout(c){ c.outcome = 'lost'; log(c, 'Closed', c.attempts ? `Closed after ${c.attempts} tries` : 'Closed for this AEP'); move(c, 'done', 'Closed for this AEP'); }
};

const modal = $('#modal');

  const f = $('#mform');

    const btn = e.submitter;

    e.preventDefault();
    const data = Object.fromEntries(new FormData(f)); data._all = new FormData(f);
    if (onSubmit(data, f) !== false) modal.close();

const foot = ok => `<div class="mf"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${ok}</button></div>`;
const radios = (name, opts) => `<div class="opts">${opts.map(([v, l, s], i) => `<label class="opt"><input type="radio" name="${name}" value="${v}" ${i === 0 ? 'checked' : ''}><span>${l}${s ? `<small>${s}</small>` : ''}</span></label>`).join('')}</div>`;

function soaModal(c, next){
  const mode = c.appt ? c.appt.mode : c.meetMode;

  const methods = [['Paper, scanned to vault', 'Scan it with your phone. Shred the paper once the scan is verified.'], ['MedicareCenter', 'E-signature link, stored with the quote'], ['HealthSherpa', 'E-signature link'], ['Carrier platform', 'Jarvis, Vantage, or another carrier tool']];
  if (!inPerson) methods.push(methods.shift());

    <div class="mh"><h2>Record the Scope of Appointment</h2><p>${esc(c.name)} needs an SOA on file before you discuss specific plans.</p></div>
    <div class="mb">
      <div class="callout">Since Oct 1, 2026 there's no 48-hour wait, so same-day is fine. The SOA still comes first, and in writing for in-person meetings.${inPerson ? ' This one is in person.' : ''}</div>
      <div><span class="lbl">How it was captured</span>${radios('method', methods)}</div>
      <div><span class="lbl">Products in scope</span><div class="chk">${['MAPD', 'PDP', 'Med Supp', 'DSNP', 'Dental / vision'].map((p, i) => `<label><input type="checkbox" name="scope" value="${p}" ${i < 2 ? 'checked' : ''}>${p}</label>`).join('')}</div></div>

    log(c, 'SOA', `Scope of Appointment recorded (${d.method})`);

}
function apptModal(c, resched){

    <div class="mh"><h2>${resched ? 'Reschedule' : 'Book'} ${esc(c.name)}</h2><p>In the real build this happens on its own when they book through your Acuity or Calendly link.</p></div>

        <div><label class="lbl" for="atime">Time</label><select class="field" id="atime" name="time">${['9:00', '10:00', '11:00', '13:00', '14:00', '15:30'].map(t => `<option value="${t}">${timeOf(new Date(2026, 0, 1, +t.split(':')[0], +t.split(':')[1]))}</option>`).join('')}</select></div>

function apptOutcomeModal(c){

  if (c.track === 'renewal') opts.push(['kept', 'Reviewed, keeping current plan', 'Counts as a completed renewal']);

function outcomeModal(c){

    <div class="callout">Note how consent was given (signed form, recorded call) in the activity log.</div></div>${foot('Save consent')}`, d => {
    ['email', 'sms', 'rvm'].forEach(k => c.consent[k] = !!d[k]);
    log(c, 'Consent', 'Contact consent updated'); toast('Consent saved.', c.name); renderAll();
  });
}

/* ============ inline new-lead form ============ */
function renderLeadForm(){
  const f = $('#leadform');
  f.innerHTML = `
    <div class="lf-grid">
      <label><span>Name</span><input class="field" name="name" autocomplete="off"></label>
      <label><span>Phone</span><input class="field" name="phone" inputmode="tel" placeholder="(704) 555-0100"></label>
      <label><span>City</span><input class="field" name="city"></label>
      <label><span>County</span><select class="field" name="county">${COUNTIES.map(([c, st]) => `<option value="${c}|${st}">${c}, ${st}</option>`).join('')}<option value="other">Outside NC or SC</option></select></label>
      <label><span>Source</span><select class="field" name="src">${Object.keys(SRC_W).map(s => `<option>${s}</option>`).join('')}</select></label>
      <label><span>Situation</span><select class="field" name="sit">${Object.keys(SIT_W).map(s => `<option>${s}</option>`).join('')}</select></label>
      <label><span>Current carrier</span><select class="field" name="carrier"><option>None</option>${CARRIERS.map(c => `<option>${c}</option>`).join('')}</select></label>
      <label><span>Agent</span><select class="field" name="agent">${AGENTS.map(a => `<option value="${a.id}" ${a.id === (state.agent === 'all' ? ME : state.agent) ? 'selected' : ''}>${a.name}</option>`).join('')}</select></label>
    </div>
    <div class="lf-foot">
      <span class="lbl" style="margin:0">They contacted us first. Written consent for:</span>
      <label class="check"><input type="checkbox" name="email"> Email</label>
      <label class="check"><input type="checkbox" name="sms"> Text</label>
      <span class="lf-err" id="lfErr" role="alert"></span>
      <span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn ghost" id="lfCancel">Cancel</button><button type="submit" class="btn primary">Add lead</button></span>
    </div>`;
}
function toggleLead(on){
  const f = $('#leadform');
  on = on ?? !f.classList.contains('on');
  if (on){ renderLeadForm(); f.classList.add('on'); f.querySelector('[name=name]').focus(); }
  else f.classList.remove('on');
  $('#addLead').setAttribute('aria-expanded', on);
}
$('#leadform').addEventListener('submit', e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const err = $('#lfErr');
  if (!d.name.trim()){ err.textContent = 'Add a name.'; return; }
  if (d.county === 'other'){ err.textContent = 'Outside the NC and SC service area. Refer them to an agent licensed in their state.'; return; }
  const [county, st] = d.county.split('|');
  const agent = AG[d.agent];
  const c = {id:nextId++, agent:agent.id, track:'lead', name:d.name.trim(), city:d.city.trim() || county, county, st, age:'Age not set', bmonth:0,
    phone:d.phone.trim(), touches:[{d:new Date(TODAY), k:'Inbound', t:`New lead from ${d.src.toLowerCase()}`}], attempts:0, firstTry:null,
    soa:null, appt:null, app:null, outcome:null, after:null, intake:'Not sent', recordings:0, note:'',
    plan:{carrier:d.carrier, name: d.sit === 'Turning 65' ? 'Not on Medicare yet' : d.carrier === 'None' ? 'Unknown' : `${d.carrier} plan (other agent)`, type:''},
    sev:'lead', source:d.src, situation:d.sit, change:d.sit, letter:null, letterDate:null, since0:`Lead from ${d.src.toLowerCase()}`,
    consent:{rvm:false, sms:!!d.sms, email:!!d.email}, inbound:true, stage:'contact', since:new Date(TODAY)};
  book.push(c); byId.set(c.id, c);
  toggleLead(false);
  toast(tierOf(c) === 1 ? 'Tier 1. It\u2019s under Call first on Today.' : `Tier ${tierOf(c)}. Added to Needs contact.`, `${c.name} added for ${agent.name}`);
  renderAll(); openDrawer(c.id);
});

/* ============ bulk ============ */
function bulk(kind, value){
  const ids = [...state.sel].map(id => byId.get(id));
  if (kind === 'letter'){
    const ok = ids.filter(c => c.track === 'renewal');
    ok.forEach(c => { c.letter = value; c.letterDate = new Date(TODAY); log(c, 'Letter', `${LETTERS[value]} mailed`); });
    toast(`${ok.length} renewals marked.${ids.length - ok.length ? ` ${ids.length - ok.length} new leads skipped.` : ''}`, `${LETTERS[value]} logged`);
  }
  if (kind === 'email' || kind === 'rvm'){
    const ok = ids.filter(c => c.consent[kind]);
    ok.forEach(c => log(c, kind === 'email' ? 'Email' : 'Blast', kind === 'email' ? 'AEP review email sent' : 'Ringless voicemail blast queued'));
    toast(`Sent to ${ok.length}. Skipped ${ids.length - ok.length} with no written ${kind === 'email' ? 'email' : 'prerecorded voicemail'} consent.`, kind === 'email' ? 'AEP email' : 'Voicemail blast', !ok.length);
  }
  if (kind === 'tier'){
    ids.forEach(c => { c.override = value === 'auto' ? null : {tier:+value, note:'Set in bulk', d:new Date(TODAY)}; });
    bump();
    toast(value === 'auto' ? `${ids.length} customers back on automatic tiers.` : `${ids.length} customers set to Tier ${value}. Hand-set tiers show an asterisk.`, 'Tier updated');
  }
  state.sel.clear();
  renderAll();
}

/* ============ render + events ============ */
function renderView(){ ({today:renderToday, board:renderBoard, table:renderTable, after:renderAfter, agency:renderAgency, rules:renderRules})[state.view](); }
function renderAll(){
  renderNav(); renderMetrics(); renderFilters(); renderView();
  if (state.open) renderDrawer();
}
function setView(v){ state.view = v; state.page = 0; if (v !== 'table') state.sel.clear(); $('#app').classList.remove('nav-open'); renderAll(); try { window.scrollTo({top:0}); } catch(e){} }

document.addEventListener('click', e => {
  if (pop.classList.contains('on') && !e.target.closest('#pop') && !e.target.closest('[data-menu],[data-cardmenu]')) closePop();
  const t = e.target.closest('button, [data-agentrow]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.view) return setView(ds.view);
  if (ds.focus){ state.focus = state.focus === ds.focus ? null : ds.focus; if (state.view === 'after' || state.view === 'agency') state.view = 'today'; state.page = 0; return renderAll(); }
  if (t.id === 'resetF'){ Object.assign(state, {focus:null, special:null, stage:'all', carrier:'all', county:'all', tier:'all', track:'all', stalled:false, q:'', page:0}); $('#q').value = ''; return renderAll(); }
  if (ds.seeall){ state.stage = ds.seeall; return setView('table'); }
  if (ds.tablefocus){ state.focus = ds.tablefocus; return setView('table'); }
  if (ds.expand){ state.expand[ds.expand] = !state.expand[ds.expand]; return renderView(); }
  if (ds.agentrow){ Object.assign(state, {agent:ds.agentrow, focus:null, special:null, stage:'all', carrier:'all', county:'all', tier:'all', track:'all', stalled:false, q:''}); $('#q').value = ''; renderAgentSelect(); return setView('today'); }
  if (ds.menu){
    const items = JSON.parse(ds.menu);
    return openPop(t, items.map(([a, l]) => `<button type="button" role="menuitem" data-act="${a}" data-id="${ds.id}">${l}</button>`).join(''));
  }
  if (ds.cardmenu){
    const c = byId.get(+ds.cardmenu);
    return openPop(t, `<div class="hd">Move to</div>${STAGES.map(s => `<button type="button" role="menuitem" data-move="${s.id}" data-id="${c.id}" ${s.id === c.stage ? 'disabled' : ''}><span class="dot" style="--c:${s.c}"></span>${s.name}${s.id === c.stage ? ' (current)' : ''}</button>`).join('')}<hr><button type="button" role="menuitem" data-open="${c.id}">Open details</button>`);
  }
  if (ds.act){ closePop(); return ACTS[ds.act](byId.get(+ds.id)); }
  if (ds.move){ closePop(); return requestMove(byId.get(+ds.id), ds.move); }
  if (ds.soa){ const c = byId.get(+ds.soa); return soaModal(c, renderAll); }
  if (ds.consent) return consentModal(byId.get(+ds.consent));
  if (ds.intake){
    const c = byId.get(+ds.intake);
    if (c.intake === 'Sent'){ c.intake = 'Returned'; log(c, 'Form', 'Meds and doctors form returned'); toast('Meds, pharmacy and doctors saved to the record.', c.name); }
    else if (c.consent.email || c.consent.sms){ c.intake = 'Sent'; log(c, 'Form', 'Meds and doctors form sent'); toast(`Form sent by ${c.consent.email ? 'email' : 'text'}.`, c.name); }
    else return toast('No written email or text consent. Hand them the paper form at the appointment, or record consent first.', `Can't send to ${c.name}`, true);
    return renderAll();
  }
  if (ds.ms){
    const c = byId.get(+ds.id), k = ds.ms;
    if (c.after[k].s === 'problem') return openDrawer(c.id);
    if (k === 'accepted') return ACTS.confirm(c);
    c.after[k] = {s:'done', d:new Date(TODAY)};
    log(c, 'After-sale', `${MS_KEYS.find(x => x[0] === k)[1]} done`);
    toast('Marked done.', c.name); return renderAll();
  }
  if (ds.sort){ const k = ds.sort; state.sort = state.sort.key === k ? {key:k, dir:-state.sort.dir} : {key:k, dir: ['days', 'consent', 'soa'].includes(k) ? -1 : 1}; return renderView(); }
  if (ds.page){ state.page += +ds.page; return renderView(); }
  if ('selall' in ds){ list().forEach(c => state.sel.add(c.id)); return renderView(); }
  if (ds.bulk){ if (ds.bulk === 'clear'){ state.sel.clear(); return renderView(); } return bulk(ds.bulk); }
  if ('close' in ds) return closeDrawer();
  if (ds.open){ closePop(); return openDrawer(+ds.open); }
  if (t.id === 'lfCancel') return toggleLead(false);
  if ('clearspecial' in ds){ state.special = null; return renderAll(); }
  if ('shpfilter' in ds){ Object.assign(state, {special:'shp', focus:null, stage:'all'}); return setView('table'); }
  if ('addsar' in ds){
    const pid = $('#rPlan').value;
    const counties = [...document.querySelectorAll('input[name=rCounty]:checked')].map(i => i.value);
    if (!counties.length) return toast('Pick at least one county.', 'Rule not added', true);
    const before = book.filter(c => tierOf(c) === 1).length;
    const ex = RULES.sar.find(r => r.pid === pid);
    if (ex) ex.counties = [...new Set(ex.counties.concat(counties))]; else RULES.sar.push({pid, counties});
    bump();
    const moved = book.filter(c => tierOf(c) === 1).length - before;
    toast(`${moved} more customers across the agency are now Tier 1. They should get Letter C.`, `${planOf(pid).name} ending in ${counties.join(', ')}`);
    return renderAll();
  }
  if (ds.delsar){ const r = RULES.sar.splice(+ds.delsar, 1)[0]; bump(); toast('Those customers now take their plan rating.', `Rule removed: ${planOf(r.pid).name}`); return renderAll(); }
  if (ds.clearovr){ const c = byId.get(+ds.clearovr); c.override = null; bump(); log(c, 'Tier', 'Tier set back to automatic'); return renderAll(); }

});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f){ state[t.dataset.f] = t.value; state.page = 0; return renderAll(); }
  if (t.id === 'fStalled'){ state.stalled = t.checked; state.page = 0; return renderAll(); }
  if (t.id === 'agent'){ state.agent = t.value; state.sel.clear(); state.page = 0; return renderAll(); }
  if (t.dataset.override){
    const c = byId.get(+t.dataset.override), note = ($('#ovrNote')?.value || '').trim();
    c.override = t.value === 'auto' ? null : {tier:+t.value, note, d:new Date(TODAY)};
    bump();
    log(c, 'Tier', t.value === 'auto' ? 'Tier set back to automatic' : `Tier set to ${t.value} by hand${note ? `: ${note}` : ''}`);
    toast(t.value === 'auto' ? `Back to Tier ${tierOf(c)} from the rules.` : `Tier ${t.value} until you set it back to automatic.`, c.name);
    return renderAll();
  }
  if (t.id === 'rStatus'){ RULES.status = t.value; RULES.updated = new Date(TODAY); return renderAll(); }
  if (t.id === 'rCarrier'){ state.ruleCarrier = t.value; return renderView(); }
  if (t.id === 'rShpOn'){ RULES.shp.on = t.checked; bump(); return renderAll(); }
  if (t.id === 'rShpStart' || t.id === 'rShpEnd'){
    if (!t.value) return;
    const [y, m, d] = t.value.split('-').map(Number);
    RULES.shp[t.id === 'rShpStart' ? 'start' : 'end'] = new Date(y, m - 1, d);
    bump(); return renderAll();
  }
  if (t.dataset.rate){
    RULES.ratings[t.dataset.rate] = t.value === 'none' ? null : +t.value; bump();
    toast('Customers on this plan re-sorted. Tier 1 rules still take priority.', `${planOf(t.dataset.rate).name}: ${t.value === '3' ? 'Tier 3' : 'Tier 2'}`);
    return renderAll();
  }
  if (t.id === 'rLeadSep'){ RULES.leadSep = t.checked; bump(); return renderAll(); }

  if (t.dataset.sel){ const id = +t.dataset.sel; t.checked ? state.sel.add(id) : state.sel.delete(id); return renderView(); }
  if (t.id === 'selPage'){ const L = sorted(list()); L.slice(state.page * 40, (state.page + 1) * 40).forEach(c => t.checked ? state.sel.add(c.id) : state.sel.delete(c.id)); return renderView(); }
  if (t.id === 'bulkLetter' && t.value) return bulk('letter', t.value);
  if (t.id === 'bulkTier' && t.value) return bulk('tier', t.value);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.note){ e.preventDefault(); const c = byId.get(+f.dataset.note), v = f.querySelector('input').value.trim(); if (v){ log(c, 'Note', v); renderDrawer(); } }
});
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); state.page = 0; renderAll(); }, 160); });
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || modal.open) return;
  if (pop.classList.contains('on')){ const a = popFor; closePop(); a?.focus(); return; }
  if (state.open) closeDrawer();
});
window.addEventListener('scroll', closePop, {passive:true});
window.addEventListener('resize', closePop);
$('#addLead').addEventListener('click', () => toggleLead());
$('#menuBtn').addEventListener('click', () => $('#app').classList.toggle('nav-open'));
$('#collapse').addEventListener('click', () => { const s = $('#app').classList.toggle('slim'); store.set('rr-slim', s ? '1' : '0'); $('#collapse').setAttribute('aria-label', s ? 'Expand sidebar' : 'Collapse sidebar'); });
if (store.get('rr-slim') === '1') $('#app').classList.add('slim');

/* drag and drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-card]'); if (!c) return; closePop(); dragId = +c.dataset.card; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId)); });
document.addEventListener('dragend', e => { e.target.classList?.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop]'); if (!col || dragId == null) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest?.('[data-drop]'); if (!col || dragId == null) return; e.preventDefault(); col.classList.remove('over'); const c = byId.get(dragId); dragId = null; requestMove(c, col.dataset.drop); });

renderSeason();
renderAgentSelect();
renderAll();
</script>
